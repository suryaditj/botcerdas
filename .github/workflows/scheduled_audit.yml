name: Scheduled MTF Analysis

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MTF analysis & optional Telegram report
        env:
          PYTHONPATH: "."
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BROADCAST_CHAT_ID: ${{ secrets.BROADCAST_CHAT_ID }}
          PUBLIC_ACCESS: "true"
        run: python -c "import os, sys; sys.path.insert(0, os.getcwd()); from scripts.run_audit import main; main()"
