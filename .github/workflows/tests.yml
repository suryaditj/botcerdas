
name: Unit Tests & Backtest

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          
      - name: Diagnose project structure
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== ROOT FILES ====="
          ls -la

          echo "===== DIRECTORY TREE ====="
          find . -maxdepth 4 -type d | sort

          echo "===== IMPORTANT PYTHON FILES ====="
          find . -maxdepth 5 -type f \( \
            -name "loader.py" -o \
            -name "entry_confirmation.py" -o \
            -name "market_structure.py" -o \
            -name "snr_snd_detector.py" \
          \) -print

          echo "===== PYTHON IMPORT PATH ====="
          python -c "import sys; print('\n'.join(sys.path))"


      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
          TWELVE_DATA_API_KEY: "ci_dummy_key"
          TELEGRAM_BOT_TOKEN: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
          PUBLIC_ACCESS: "true"
        run: python -m pytest -v
