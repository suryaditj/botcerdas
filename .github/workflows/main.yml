name: Bot Workflow

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        env:
          PYTHONPATH: "."
          TWELVE_DATA_API_KEY: "ci_test_key"
          TELEGRAM_BOT_TOKEN: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
          ALLOWED_USER_IDS: "111222333"
          PUBLIC_ACCESS: "true"
        run: python -c "import os, sys, pytest; sys.path.insert(0, os.getcwd()); raise SystemExit(pytest.main(['-v']))"

      - name: Run scheduled MTF audit
        env:
          PYTHONPATH: "."
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BROADCAST_CHAT_ID: ${{ secrets.BROADCAST_CHAT_ID }}
          PUBLIC_ACCESS: "true"
        run: python -c "import os, sys; sys.path.insert(0, os.getcwd()); from scripts.run_audit import main; main()"
